name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # Exercise the signing jobs without cutting a release.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so `git describe --tags` in the Makefile stamps the
          # real version instead of a bare commit hash.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build darwin/linux/windows binaries
        run: make release

      # Linux needs no signing; darwin and windows go through the signing
      # jobs below, so the platforms travel as separate artifacts.
      - uses: actions/upload-artifact@v7
        with:
          name: arc-linux
          path: dist/arc-linux-*
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: arc-darwin-unsigned
          path: dist/arc-darwin-*
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: arc-windows-unsigned
          path: dist/arc-windows-*
          if-no-files-found: error

  # Sign with the Developer ID Application certificate and notarize, so a
  # browser-downloaded binary passes Gatekeeper instead of "cannot be opened
  # because the developer cannot be verified". Bare executables cannot carry a
  # stapled ticket; Gatekeeper finds the notarization online, which is the
  # standard arrangement for CLI tools.
  sign-macos:
    name: Sign + notarize macOS
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: arc-darwin-unsigned
          path: dist

      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASS="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN"
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASS" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

      - name: Sign
        run: |
          IDENTITY=$(security find-identity -v -p codesigning \
            | awk -F'"' '/Developer ID Application/ {print $2; exit}')
          if [ -z "$IDENTITY" ]; then
            echo "no Developer ID Application identity in the keychain" >&2
            exit 1
          fi
          for bin in dist/arc-darwin-*; do
            codesign --force --sign "$IDENTITY" --options runtime --timestamp "$bin"
            codesign --verify --strict --verbose=2 "$bin"
          done

      - name: Notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          # One zip with both binaries: notarization registers each Mach-O's
          # hash, and the zip itself is only a submission container.
          ditto -c -k dist notarize.zip
          SUBMIT=$(xcrun notarytool submit notarize.zip \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait --output-format json)
          echo "$SUBMIT" | jq '{id, status}'
          if [ "$(echo "$SUBMIT" | jq -r .status)" != "Accepted" ]; then
            xcrun notarytool log "$(echo "$SUBMIT" | jq -r .id)" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --team-id "$APPLE_TEAM_ID"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: arc-darwin-signed
          path: dist/arc-darwin-*
          if-no-files-found: error

  # Authenticode via Azure Artifact Signing, so Windows shows a verified
  # publisher instead of "Unknown publisher". The certificate itself lives
  # ~3 days; the RFC 3161 timestamp is what keeps the signature valid forever.
  sign-windows:
    name: Sign Windows
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: arc-windows-unsigned
          path: dist

      - name: Sign with Azure Artifact Signing
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          $ErrorActionPreference = "Stop"
          Install-Module -Name TrustedSigning -MinimumVersion 0.5.0 -Force `
            -Repository PSGallery -Scope CurrentUser
          Invoke-TrustedSigning `
            -Endpoint "https://wus2.codesigning.azure.net" `
            -CodeSigningAccountName "nowplaying" `
            -CertificateProfileName "nowplaying-desktop" `
            -Files (Resolve-Path "dist/arc-windows-amd64.exe").Path `
            -FileDigest SHA256 `
            -TimestampRfc3161 "http://timestamp.acs.microsoft.com" `
            -TimestampDigest SHA256

      - name: Verify signature
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $sig = Get-AuthenticodeSignature dist/arc-windows-amd64.exe
          if ($sig.Status -ne "Valid") {
            throw "signature is $($sig.Status): $($sig.StatusMessage)"
          }
          if (-not $sig.TimeStamperCertificate) {
            throw "signature has no timestamp; it would expire with the certificate"
          }
          Write-Host "Signature OK: $($sig.SignerCertificate.Subject)"

      - uses: actions/upload-artifact@v7
        with:
          name: arc-windows-signed
          path: dist/arc-windows-*
          if-no-files-found: error

  release:
    name: Attach binaries to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, sign-macos, sign-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: arc-linux
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: arc-darwin-signed
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: arc-windows-signed
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
